<body data-page="automations" data-root="../" data-title="Automations" data-crumb="Content" class="pre-auth">

<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <div class="main-wrapper">
    <header class="topbar" id="topbar"></header>

    <main class="page-content" id="page-content">
      <div class="page-head">
        <div>
          <h1 class="page-title">Automations</h1>
          <p class="page-sub">Event-triggered emails. Rules and availability come from the backend &mdash; nothing is shown as active unless the backend reports it enabled.</p>
        </div>
        <div class="page-actions">
          <button class="btn btn-secondary" id="auto-refresh" type="button">
            <i data-lucide="refresh-cw" class="btn-icon"></i><span>Refresh</span>
          </button>
        </div>
      </div>

      <!-- Summary strip -->
      <section class="auto-summary" id="auto-summary" aria-busy="true"></section>

      <!-- Automation rules (rendered from backend response) -->
      <section id="auto-list" class="auto-list" aria-live="polite"></section>
      <div class="state-box" id="auto-state"></div>
    </main>

    <footer class="page-footer">
      <span>SMMARIA Email Manager</span><span class="footer-sep">·</span><span>Automations</span>
    </footer>
  </div>
</div>
